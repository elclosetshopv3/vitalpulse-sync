<style>
:root {
  --teal:#00BFA5; --teal-d:#009688; --indigo:#5B4FE0; --red:#C62828; --red-d:#B71C1C;
  --blue:#1565C0; --navy:#1B2A4A; --amber:#E65100; --green:#2E7D32;
  --yellow-bg:#FFF8E1; --red-bg:#FFEBEE;
  --bg:#F5F7FA; --surf:#FFFFFF; --surf2:#F0F4F8; --text:#1B2A4A; --text2:#6B7A99; --text3:#A0ABBE;
  --bdr:#E2E8F0; --shad:0 2px 8px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1923;--surf:#1A2535;--surf2:#1F2E42;--text:#F0F4F8;--text2:#8899B0;--text3:#5A6A80;
  --bdr:#2A3A50;--shad:0 2px 8px rgba(0,0,0,.35);--yellow-bg:rgba(255,179,0,.12);--red-bg:rgba(198,40,40,.12);
}}
:root[data-theme="dark"]{
  --bg:#0F1923;--surf:#1A2535;--surf2:#1F2E42;--text:#F0F4F8;--text2:#8899B0;--text3:#5A6A80;
  --bdr:#2A3A50;--shad:0 2px 8px rgba(0,0,0,.35);--yellow-bg:rgba(255,179,0,.12);--red-bg:rgba(198,40,40,.12);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif;}
body{background:var(--bg);display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding:14px;gap:10px;}

/* Dev controls */
#dev-ctrl{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:480px;align-items:center;}
.ctl-btn{padding:5px 13px;border-radius:18px;border:1.5px solid var(--bdr);background:var(--surf);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;}
.ctl-btn.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.ctl-btn.on-c{background:var(--red-d);color:#fff;border-color:var(--red-d);}
.ctl-sep{font-size:11px;color:var(--text2);}
.ctl-sel{padding:5px 10px;border-radius:18px;border:1.5px solid var(--bdr);background:var(--surf);color:var(--text);font-size:12px;cursor:pointer;font-family:Inter,sans-serif;}

/* Phone shell */
#app-root{
  width:390px;height:min(844px,calc(100dvh - 150px));max-width:100vw;max-height:100dvh;
  background:var(--bg);border-radius:40px;overflow:hidden;position:relative;
  box-shadow:0 22px 60px rgba(0,0,0,.2),0 0 0 2px var(--bdr);
  display:flex;flex-direction:column;
}
@media(max-width:430px){
  /* --vh la calcula un pequeño script más abajo (más confiable que 100dvh
     en algunas versiones de Safari, que a veces no mide bien el alto justo
     al cargar la página) — con respaldo a 100dvh si el script no corrió. */
  #app-root{border-radius:0;box-shadow:none;width:100vw;height:100dvh;height:calc(var(--vh,1dvh) * 100);}
  #dev-ctrl{display:none;}
  body{padding:0;min-height:100dvh;min-height:calc(var(--vh,1dvh) * 100);}
  /* En pantalla completa (sin los márgenes del "marco" de teléfono), el
     encabezado queda pegado al borde superior real del dispositivo — se le
     agrega el alto de la barra de estado/notch para que no quede encimado. */
  .hdr{padding-top:calc(13px + env(safe-area-inset-top));}
}
/* Respaldo: esconde la barra de controles de desarrollo en cualquier
   dispositivo táctil (teléfono o tablet), sin importar el ancho reportado
   — cubre casos como "Solicitar sitio de escritorio" en Safari, donde el
   ancho reportado puede ser mayor a 430px aunque siga siendo un touchscreen. */
@media(pointer:coarse){
  #dev-ctrl{display:none!important;}
}

/* Scrollable screen area */
.scr{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.scr::-webkit-scrollbar{display:none;}
.pad{padding:16px;display:flex;flex-direction:column;gap:13px;padding-bottom:20px;}

/* Header */
.hdr{background:var(--surf);padding:13px 18px 11px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:10px;}
.hdr-logo{font-size:16px;font-weight:800;color:var(--teal);letter-spacing:-.3px;white-space:nowrap;}
.hdr-title{font-size:16px;font-weight:700;color:var(--text);}
.seg{display:flex;border-radius:20px;overflow:hidden;border:1.5px solid var(--indigo);flex-shrink:0;}
.seg-btn{padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--indigo);font-family:Inter,sans-serif;white-space:nowrap;}
.seg-btn.on{background:var(--indigo);color:#fff;}

/* 5-tab bar */
.tab-bar{display:flex;background:var(--surf);border-top:1px solid var(--bdr);flex-shrink:0;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 2px 9px;cursor:pointer;border:none;background:none;color:var(--text2);font-size:9px;font-weight:600;font-family:Inter,sans-serif;gap:3px;}
.tab.on{color:var(--indigo);}
.tab svg{width:22px;height:22px;}

/* Registrar — raised center button built into the tab bar itself, so it's
   always visible but lives in reserved chrome space and never covers content */
.tab-fab{position:relative;}
.fab-circle{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:400;line-height:1;box-shadow:0 3px 8px rgba(0,191,165,.4);margin-top:-6px;flex-shrink:0;}
.tab-fab span:last-child{color:var(--teal);font-weight:700;}
.tab-fab.on .fab-circle{background:var(--teal-d);}

/* Tappable hint on cards */
.tap-hint{color:var(--text3);font-size:15px;flex-shrink:0;}

/* Cards */
.card{background:var(--surf);border-radius:16px;padding:16px;box-shadow:var(--shad);}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.vcard{background:var(--surf);border-radius:14px;padding:14px;box-shadow:var(--shad);cursor:pointer;}
.vcard:active{opacity:.82;}
.vcl{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;}
.vcv{font-size:25px;font-weight:800;color:var(--text);line-height:1;font-variant-numeric:tabular-nums;}
.vcu{font-size:11px;color:var(--text2);margin-top:3px;}
.bdg{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;margin-top:6px;}

/* Alerts */
.alert{border-radius:12px;padding:11px 13px;display:flex;align-items:flex-start;gap:9px;}
.aw{background:var(--yellow-bg);border:1px solid #FFB300;}
.ad{background:var(--red-bg);border:1px solid var(--red);}

/* Stepper */
.step{display:flex;align-items:center;border-radius:14px;overflow:hidden;border:1.5px solid var(--bdr);background:var(--surf2);}
.step-b{width:44px;height:48px;font-size:24px;font-weight:300;cursor:pointer;border:none;background:transparent;color:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-v{flex:1;text-align:center;font-size:22px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;line-height:1;}
.step-u{font-size:10px;color:var(--text2);text-align:center;margin-top:2px;}

/* Buttons */
.btn-p{background:var(--indigo);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;width:100%;cursor:pointer;font-family:Inter,sans-serif;}
.btn-p.teal{background:var(--teal);}
.btn-p:active{opacity:.9;}
.btn-s{background:transparent;color:var(--text2);border:1.5px solid var(--bdr);border-radius:14px;padding:12px;font-size:14px;font-weight:500;width:100%;cursor:pointer;font-family:Inter,sans-serif;}
.btn-gh{background:transparent;border:none;color:var(--indigo);font-size:14px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;padding:8px 0;}

/* Input */
.inp{background:var(--surf2);border:1.5px solid var(--bdr);border-radius:12px;padding:11px 15px;font-size:15px;color:var(--text);width:100%;font-family:Inter,sans-serif;outline:none;}
.inp:focus{border-color:var(--teal);}
.inp-t{background:var(--surf2);border:1.5px solid var(--bdr);border-radius:12px;padding:10px;font-size:24px;font-weight:800;color:var(--text);font-family:Inter,sans-serif;outline:none;text-align:center;width:100%;}
.inp-t:focus{border-color:var(--teal);}

/* Modal */
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;flex-direction:column;justify-content:flex-end;}
.sheet{background:var(--surf);border-radius:24px 24px 0 0;padding:22px 20px;display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto;}
.sheet::-webkit-scrollbar{display:none;}
.sheetT{font-size:17px;font-weight:700;color:var(--text);}

/* Section label */
.slbl{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;}

/* Row */
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--bdr);}
.row:last-child{border-bottom:none;}

/* Avatar */
.av{border-radius:50%;background:var(--teal);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* Onboarding */
.ob{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:18px;}

/* Adherence bar */
.ab{height:7px;border-radius:4px;background:var(--surf2);overflow:hidden;}
.af{height:100%;border-radius:4px;background:var(--teal);}
.af.warn{background:var(--amber);}

/* Med menu */
.med-menu{position:absolute;right:8px;top:38px;background:var(--surf);border:1px solid var(--bdr);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.14);z-index:101;overflow:hidden;min-width:120px;}
.mmi{display:block;width:100%;padding:11px 15px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;border:none;background:none;text-align:left;font-family:Inter,sans-serif;}
.mmi:hover{background:var(--surf2);}
.mmi.del{color:var(--red);}

/* Profile menu rows */
.hdr-back{display:flex;align-items:center;gap:8px;min-width:0;}
.back-btn{width:30px;height:30px;border-radius:50%;border:none;background:var(--surf2);color:var(--indigo);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:Inter,sans-serif;}
.menu-row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--bdr);cursor:pointer;}
.menu-row:last-child{border-bottom:none;}
.menu-ic{width:40px;height:40px;border-radius:12px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.menu-tx{flex:1;min-width:0;}
.menu-tt{font-size:14px;font-weight:700;color:var(--text);}
.menu-sb{font-size:12px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.menu-chev{font-size:18px;color:var(--text3);flex-shrink:0;}

/* "Moved from..." annotation callout */
.note{border:1.5px dashed rgba(91,79,224,.45);border-radius:16px;position:relative;padding-top:24px;}
.note-tag{position:absolute;top:-11px;left:14px;background:var(--indigo);color:#fff;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:8px;}
</style>

<div id="dev-ctrl">
  <select class="ctl-sel" id="scr-sel" onchange="gotoScr(this.value)">
    <option value="dashboard">Dashboard</option>
    <option value="history">Historia</option>
    <option value="medications">Medicamentos</option>
    <option value="reports">Reportes</option>
    <option value="profile">Perfil</option>
    <option value="log">Registrar (modal)</option>
    <option value="onboarding">Onboarding</option>
    <option value="login">Login</option>
    <option value="caregiverFeed">Caregiver Feed</option>
  </select>
  <span class="ctl-sep">Estado:</span>
  <button class="ctl-btn on" id="btn-n" onclick="setDemo('n')">Normal</button>

  <span class="ctl-sep">|</span>
  <button class="ctl-btn" id="btn-lt" onclick="setTheme('light')">☀️</button>
  <button class="ctl-btn" id="btn-dk" onclick="setTheme('dark')">🌙</button>
</div>
<div id="app-root"></div>

<script>
// ─── State ──────────────────────────────────────────────────────────────────
const DEFAULT_STATE={
  screen:'dashboard',obStep:1,profileView:'menu',symToggle:false,logBackup:null,
  conditions:{hta:true,dm:true,other:false},otherDiagnosis:'',
  amMinutes:8*60,pmMinutes:20*60,
  sys:132,dia:84,hr:72,glucose:108,glucoseGoal:130,glucoseGoalPost:180,
  glucoseContext:'ayunas',historyGlCtx:'ayunas',
  readingMinutes:7*60+32,lang:'ES',glucoseUnit:'mgdl',trendMetric:'pa',
  symptoms:{headache:false,dizzy:false,blur:true,palp:false,fatigue:false,fever:false,none:false},
  medTaken:{m1:[true,false],m2:[true,true],m3:[true]},
  customMeds:[
    {id:'m1',name:'Losartán',dose:'50mg',timesPerDay:2},
    {id:'m2',name:'Metformina',dose:'850mg',timesPerDay:2},
    {id:'m3',name:'Amlodipino',dose:'5mg',timesPerDay:1},
  ],
  openMedMenuId:null,editingMedId:null,deleteMedId:null,
  showAddMed:false,newMedName:'',newMedDose:'',newMedTimesPerDay:2,
  range:'Semana',showPaywall:false,premium:false,trialActive:true,trialDaysLeft:23,
  caregiverCodeInput:'',codeErrorShown:false,
  caregivers:[{name:'Ana García',initials:'AG'},{name:'Luis Pérez',initials:'LP'}],
  inviteCode:'VP-4821',codeCopied:false,
  reportPeriod:'weekly',reportGenerated:false,viewReportIdx:0,
  weeklyReports:null,monthlyReport:null,sixMonthReport:null,shareChannel:null,
  reminderRecipient:'both',name:'Roberto García',
  dark:false,noData:false,crisis:false,notes:'',
};
let s={...DEFAULT_STATE};

// ─── Persistence ────────────────────────────────────────────────────────────
// This published page has its own origin, so localStorage here is private to
// whoever is viewing it in their own browser and survives a reload — but only
// on that device. Reads/writes are wrapped in try/catch: private browsing, a
// blocked store, or a corrupt payload should never break the app — it just
// falls back to the demo defaults above.
const STORAGE_KEY='vitalpulse-sync-state-v1';
// Fields that only make sense for the CURRENT visit — a modal left open, a
// half-typed invite code, the demo-data toggle — are never restored, so a
// fresh load always starts clean on Inicio even though the patient's actual
// data (readings, medications, diagnoses, settings) comes back.
const EPHEMERAL_FIELDS=['screen','logBackup','showPaywall','showAddMed','editingMedId',
  'deleteMedId','openMedMenuId','newMedName','newMedDose','newMedTimesPerDay',
  'caregiverCodeInput','codeErrorShown','codeCopied','shareChannel','reportGenerated',
  'noData','crisis'];
(function loadPersistedState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved=JSON.parse(raw);
      if(saved&&typeof saved==='object')Object.assign(s,saved);
    }
  }catch(e){/* private browsing / storage blocked / corrupt payload — keep demo defaults */}
  EPHEMERAL_FIELDS.forEach(k=>{s[k]=DEFAULT_STATE[k];});
  // Drop any key that isn't part of the current shape — e.g. a field like the old
  // logTurn that a past version stored and later versions removed. Without this,
  // a stale key from an old save lingers in localStorage forever (harmless since
  // nothing reads it, but it's dead weight that's easy to just not carry forward).
  Object.keys(s).forEach(k=>{if(!(k in DEFAULT_STATE))delete s[k];});
})();
function persistState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s));}catch(e){/* storage full/blocked — just won't survive a reload */}
}

const root=document.getElementById('app-root');

// Tracks the scrollable .scr container's scroll position across re-renders, so a
// setState() that doesn't change screen (e.g. picking a share channel in Reportes)
// doesn't jump back to the top — root.innerHTML= otherwise discards the old .scr
// node on every render and any scroll position is lost with it.
let __scrKey=null,__scrollTop=0;

function setState(up){
  if(typeof up==='function'){Object.assign(s,up({...s}));}else{Object.assign(s,up);}
  persistState();
  render();
}

// ─── Helpers ────────────────────────────────────────────────────────────────
const tx=(es,en)=>s.lang==='ES'?es:en;
const isMmol=()=>s.glucoseUnit==='mmol';
const GFACTOR=18.0182;
const mgToMmol=v=>Math.round(v/GFACTOR*10)/10;
const mmolToMg=v=>Math.round(v*GFACTOR);
const fmtGl=v=>isMmol()?mgToMmol(v).toFixed(1):String(Math.round(v));
const glU=()=>isMmol()?'mmol/L':'mg/dL';
const fmtTime=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
// 12-hour display with AM/PM — used everywhere the app SHOWS a time to the patient.
// fmtTime (24h) stays only for the value= of native <input type="time">, which the
// HTML spec requires in 24h regardless of how the browser then displays it.
const fmtTime12=m=>{m=((m%1440)+1440)%1440;let h=Math.floor(m/60);const mm=m%60;const ap=h<12?'AM':'PM';h=h%12;if(h===0)h=12;return`${h}:${String(mm).padStart(2,'0')} ${ap}`;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// Clinical engine — per README
function classifyBP(sys,dia){
  if(sys>=180||dia>=110)return{k:'crisis',lbl:tx('CRISIS','CRISIS'),bg:'#B71C1C',c:'#fff'};
  if(sys>=160||dia>=100)return{k:'s2',lbl:tx('Etapa 2','Stage 2'),bg:'#C62828',c:'#fff'};
  if(sys>=140||dia>=90) return{k:'s1',lbl:tx('Etapa 1','Stage 1'),bg:'#E65100',c:'#fff'};
  if(sys>=120||dia>=80) return{k:'elev',lbl:tx('Elevada','Elevated'),bg:'#F9A825',c:'#1B2A4A'};
  return{k:'normal',lbl:tx('Normal','Normal'),bg:'#2E7D32',c:'#fff'};
}
// Personal goal for a given measurement context — ayunas (fasting) defaults near
// the ADA fasting target, posprandial (1-2h post-meal) defaults higher since blood
// glucose normally rises after eating. Both are independently editable in Perfil.
function glGoalFor(ctx){return ctx==='post'?s.glucoseGoalPost:s.glucoseGoal;}
function glCtxLabel(ctx){return ctx==='post'?tx('Posprandial','Post-meal'):tx('Ayunas','Fasting');}
// Estimated HbA1c from a period's average glucose (ADAG study formula, the same
// one glucometer/CGM apps use for "estimated A1C"): eAG(mg/dL) = 28.7×A1C − 46.7,
// solved for A1C. Uses the simple average of the period's ayunas/posprandial
// averages as a proxy for overall glycemic control — it's an ESTIMATE from
// self-reported averages, not a lab HbA1c, and is labeled/captioned as such
// everywhere it's shown.
function estHbA1c(glAyunas,glPost){
  const avgMg=(glAyunas+glPost)/2;
  return((avgMg+46.7)/28.7).toFixed(1);
}
// Fixed "very high" ceiling per context (ADA) — but a physician can raise a
// patient's personal goal above it (e.g. a relaxed goal for a frail elderly
// patient), and the ceiling must never sit BELOW the goal that defines "ok" —
// otherwise a reading inside the patient's own goal would get flagged as the
// most severe category. Clamping the ceiling to at least goal+1 keeps the
// ok → hi → vh → crisis bands always in that order, whatever the goal is set to.
function glVhBoundFor(ctx){
  const fixed=ctx==='post'?250:180;
  return Math.max(fixed,glGoalFor(ctx)+1);
}
// Hypoglycemia and crisis thresholds are clinical constants independent of context.
// The "high" floor differs by context because a normal post-meal reading is
// expected to run higher than a normal fasting one (ADA) — but "high" also
// fires whenever a reading exceeds the patient's own goal, whichever is lower.
function classifyGl(v,ctx){
  const goal=glGoalFor(ctx);
  const hiFloor=ctx==='post'?140:125;
  if(v<70) return{k:'hypo',lbl:tx('Hipoglicemia','Hypoglycemia'),bg:'#C62828',c:'#fff'};
  if(v>300)return{k:'crisis',lbl:tx('CRISIS','CRISIS'),bg:'#B71C1C',c:'#fff'};
  if(v>glVhBoundFor(ctx))return{k:'vh',lbl:tx('Muy alta','Very high'),bg:'#C62828',c:'#fff'};
  if(v>goal||v>hiFloor)return{k:'hi',lbl:tx('Alta','High'),bg:'#E65100',c:'#fff'};
  return{k:'ok',lbl:tx('Meta ✓','Goal ✓'),bg:'#2E7D32',c:'#fff'};
}
function classifyHR(hr){
  if(hr<40||hr>150)return{k:'crisis',lbl:tx('CRISIS','CRISIS'),bg:'#B71C1C',c:'#fff'};
  if(hr<60)return{k:'brady',lbl:tx('Bradicardia','Bradycardia'),bg:'#E65100',c:'#fff'};
  if(hr>100)return{k:'tachy',lbl:tx('Taquicardia','Tachycardia'),bg:'#E65100',c:'#fff'};
  return{k:'normal',lbl:tx('Normal','Normal'),bg:'#2E7D32',c:'#fff'};
}
function bdg(b){return`<span class="bdg" style="background:${b.bg};color:${b.c}">${b.lbl}</span>`;}
// Alert-feed severity (Familiar/Cuidador) — maps a classification key to the
// feed's 3-tier severity ('d' danger/red, 'w' caution/amber, 'ok' normal/teal),
// matching the same color convention already used for the badges (bdg) and the
// Dashboard's alert cards, so a glucose or BP alert in the caregiver feed is
// exactly as urgent-looking as the value actually is — not a flat amber for
// everything short of full crisis.
function alertSevBP(k){if(k==='crisis'||k==='s2'||k==='s1')return'd';if(k==='elev')return'w';return'ok';}
function alertSevGl(k){if(k==='crisis'||k==='vh'||k==='hypo')return'd';if(k==='hi')return'w';return'ok';}

function greeting(){
  const h=new Date().getHours();
  if(h<12)return tx('Buenos días','Good morning');
  if(h<19)return tx('Buenas tardes','Good afternoon');
  return tx('Buenas noches','Good evening');
}

function computeMeds(){
  return s.customMeds.map(cm=>{
    const taken=s.medTaken[cm.id]||Array(cm.timesPerDay).fill(false);
    const slots=Array.from({length:cm.timesPerDay},(_,i)=>({
      label:cm.timesPerDay===1?tx('Dosis única','Single dose'):
            i===0?tx('Mañana','Morning'):i===1?tx('Tarde/Noche','Eve/Night'):`#${i+1}`,
      check:!!taken[i]
    }));
    return{...cm,slots,allTaken:slots.every(sl=>sl.check),anyMissed:slots.some(sl=>!sl.check)};
  });
}

// Sparkline SVG (7-day BP)
function sparkSVG(data,w=272,h=54){
  if(!data||!data.length)return`<div style="height:${h}px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:12px">${tx('Sin datos','No data')}</div>`;
  const n=data.length,yMin=50,yMax=200;
  const toY=v=>h-((Math.max(yMin,Math.min(yMax,v))-yMin)/(yMax-yMin))*h;
  const toX=(i)=>(n<2?w/2:i/(n-1)*w).toFixed(1);
  const sy=data.map((d,i)=>`${toX(i)},${toY(d.sys).toFixed(1)}`).join(' ');
  const dy=data.map((d,i)=>`${toX(i)},${toY(d.dia).toFixed(1)}`).join(' ');

    <polyline points="${sy}" fill="none" stroke="#C62828" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="${dy}" fill="none" stroke="#1565C0" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${toX(n-1)}" cy="${toY(last.sys).toFixed(1)}" r="3.5" fill="#C62828"/>
    <circle cx="${toX(n-1)}" cy="${toY(last.dia).toFixed(1)}" r="3.5" fill="#1565C0"/>

}

// Single-series sparkline (7-day Glucosa or FC), optional goal line

// Which vital modules apply to this patient's diagnoses. An unrecognized/free-text
// condition alone ("Otra condición") doesn't hide anything — we only hide a module
// when we positively know it doesn't apply (the opposite box is unchecked).
function vitalsVisibility(){
  const none=!s.conditions.hta&&!s.conditions.dm;
  return{showBP:s.conditions.hta||none,showGl:s.conditions.dm||none};
}
function diagLabel(){
  const parts=[];
  if(s.conditions.hta)parts.push('HTA');
  if(s.conditions.dm)parts.push(tx('Diabetes','Diabetes'));

// History line chart
// Shared axis layer for History charts: numeric gridlines on the left, an optional
// shaded reference band (e.g. AHA normal HR range), and an optional dashed threshold line.
function refLineSVG(marginL,w,h,yMin,yMax,refLine){
  if(!refLine)return'';
  const toY=v=>h-((v-yMin)/(yMax-yMin))*h;
  const y=toY(refLine.value).toFixed(1);
  return`<line x1="${marginL}" y1="${y}" x2="${w}" y2="${y}" stroke="${refLine.color}" stroke-width="1.3" stroke-dasharray="4,3" opacity=".8"/><text x="${w}" y="${(+y-4).toFixed(1)}" text-anchor="end" font-size="9.5" font-weight="700" fill="${refLine.color}">${refLine.label}</text>`;
}
// deferRefLine: cuando es true, axisLayer dibuja los ejes/banda pero NO la línea+etiqueta
// de referencia — el llamador la dibuja aparte con refLineSVG(), en el orden que necesite
// (ver glucSVG: así la etiqueta "Meta X" se pinta DESPUÉS de la línea de datos, no antes,
// y nunca queda tapada por ella).
function axisLayer(marginL,w,h,yMin,yMax,yTicks,band,refLine,deferRefLine){
  const toY=v=>h-((v-yMin)/(yMax-yMin))*h;
  let out='';
  if(band){
    const y0=toY(band.to),y1=toY(band.from);
    out+=`<rect x="${marginL}" y="${y0.toFixed(1)}" width="${w-marginL}" height="${(y1-y0).toFixed(1)}" fill="${band.color||'#2E7D32'}" opacity=".12"/>`;
  }
  yTicks.forEach(t=>{
    const y=toY(t).toFixed(1);
    out+=`<line x1="${marginL}" y1="${y}" x2="${w}" y2="${y}" stroke="var(--bdr)" stroke-width="1"/>`;
    out+=`<text x="${marginL-6}" y="${(+y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--text3)">${t}</text>`;
  });
  if(refLine&&!deferRefLine)out+=refLineSVG(marginL,w,h,yMin,yMax,refLine);
  return out;
}
function axisDayLabels(marginL,w,h,days){
  const n=days.length,drawW=w-marginL,toX=i=>marginL+(n<2?drawW/2:i/(n-1)*drawW);
  return days.map((d,i)=>`<text x="${toX(i).toFixed(1)}" y="${h+14}" text-anchor="middle" font-size="10" fill="var(--text2)">${d}</text>`).join('');
}

// PA chart (Historia) — eje de valores + línea de referencia en el umbral de Etapa 1 (140)

// FC chart (Historia) — banda verde 60–100 bpm: rango normal en reposo según la American
// Heart Association (heart.org), el mismo criterio que ya usa classifyHR().
function hrHistSVG(hrA,lbs,w=320,h=100){
  const n=hrA.length;if(!n)return'';
  const marginL=26,yMin=40,yMax=160,drawW=w-marginL;

// Glucose chart (Historia) — eje de valores + banda verde hasta la meta personal (color-coded segments)
// Fix (28 ago): la etiqueta "Meta X" se pinta DESPUÉS de la línea/puntos de la
// lectura (segs+dots), no antes — así queda siempre en la capa de arriba y no se
// tapa cuando una lectura reciente sube cerca del nivel de la meta (ambas quedan
// ancladas en el mismo borde derecho, el punto de "hoy").
function glucSVG(vals,goal,lbs,w=320,h=100){
  const n=vals.length;if(!n)return'';
  const marginL=26,yMin=40,yMax=310,drawW=w-marginL;
  const toY=v=>h-((Math.max(yMin,Math.min(yMax,v))-yMin)/(yMax-yMin))*h;
  const toX=i=>marginL+(n<2?drawW/2:i/(n-1)*drawW);
  const pts=vals.map((v,i)=>({x:toX(i),y:toY(v),clr:v>300?'#B71C1C':v>180?'#C62828':v>goal||v>130?'#E65100':v<70?'#C62828':'#2E7D32'}));
  const segs=pts.slice(0,-1).map((p,i)=>`<line x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${pts[i+1].x.toFixed(1)}" y2="${pts[i+1].y.toFixed(1)}" stroke="${pts[i+1].clr}" stroke-width="2.2" stroke-linecap="round"/>`).join('');
  const dots=pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${p.clr}"/>`).join('');
  const goalRef={value:goal,color:'#2E7D32',label:tx('Meta · ','Goal · ')+fmtGl(goal)};
  return`<svg width="100%" viewBox="0 0 ${w} ${h+18}" style="overflow:visible;display:block">
    ${axisLayer(marginL,w,h,yMin,yMax,[70,130,180,300],{from:yMin,to:goal,color:'#2E7D32'},goalRef,true)}
    ${segs}${dots}
    ${refLineSVG(marginL,w,h,yMin,yMax,goalRef)}
    ${axisDayLabels(marginL,w,h,lbs)}
  </svg>`;
}

// Glucose classification gauge — the colored band's "very high" boundary shifts
// with context (180 fasting / 250 post-meal per ADA) while the axis itself stays
// fixed so the gauge's size/shape never changes between contexts.

    <div style="text-align:center;margin-bottom:6px">
      <div style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px">${tx('Tu lectura está','Your reading is')} · ${glCtxLabel(ctx)}</div>

      <div style="position:absolute;left:${glPct}%;top:42px;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:9px solid ${cls.bg};z-index:3"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-top:4px">
      <span>${tx('Normal','Normal')}</span>
      <span>${tx('Alto','High')}</span>

}

function rDashboard(){
  const v=getVitals();
  const bp=classifyBP(v.sys,v.dia);
  const gl=classifyGl(v.gl,v.glCtx);
  const hr=classifyHR(v.hr);
  const vis=vitalsVisibility();
  const meds=computeMeds();
  const takenC=meds.reduce((a,m)=>a+m.slots.filter(sl=>sl.check).length,0);
  const totalC=meds.reduce((a,m)=>a+m.slots.length,0);
  const medOk=takenC===totalC;
  // Las alertas de cifras fuera de rango dependen de la severidad clínica del valor,
  // nunca del diagnóstico: un registro ocasional fuera de la rutina esperada también alerta.
  const bpAlert=bp.k==='crisis'||bp.k==='s2'||bp.k==='s1';
  const glAlert=gl.k!=='ok';
  const hrAlert=hr.k!=='normal';
  const medAlert=meds.some(m=>m.anyMissed);
  const days=s.lang==='ES'?['L','M','X','J','V','S','D']:['M','T','W','T','F','S','S'];
  const noD=s.noData;

  // Trend tabs: only the metrics that apply to this patient's diagnoses — FC always included
  const trendTabs=[
    ...(vis.showBP?[{id:'pa',l:'PA'}]:[]),
    ...(vis.showGl?[{id:'gl',l:tx('Glucosa','Glucose')}]:[]),
    {id:'fc',l:'FC'},
  ];
  const activeTrend=trendTabs.some(t=>t.id===s.trendMetric)?s.trendMetric:trendTabs[0].id;

    ${glAlert&&!noD?`<div class="alert ad"><span style="font-size:18px;flex-shrink:0">⚠️</span><div><div style="font-weight:700;color:var(--red);font-size:13px">${tx('Glucosa fuera de rango','Glucose out of range')}</div><div style="font-size:12px;color:var(--text2);margin-top:2px">${fmtGl(v.gl)} ${glU()} — ${gl.lbl}</div></div></div>`:''}

    <!-- Vitales primarios: Presión y/o Glucosa — solo los que apliquen según diagnóstico -->
    <div style="text-align:center;margin-top:-2px">
      ${!noD?`<div style="font-size:11.5px;color:var(--text2);margin-bottom:2px">${tx('Última toma: hoy ','Last reading: today ')}${fmtTime12(s.readingMinutes)}</div>`:''}
      <div style="font-size:11.5px;font-weight:600;color:var(--text2)">${tx('Toca una tarjeta para actualizar','Tap a card to update')}</div>
    </div>
    <div class="vgrid" style="${vis.showBP&&vis.showGl?'':'grid-template-columns:1fr'}">
      ${vis.showBP?`<div class="vcard" style="padding:16px;border-left:3px solid ${noD?'var(--bdr)':bp.bg};position:relative" onclick="openLog()">
        <span class="tap-hint" style="position:absolute;top:12px;right:12px">›</span>
        <div class="vcl">🫀 ${tx('Presión','Blood P.')}</div>
        ${noD?`<div style="font-size:13px;color:var(--text2);padding:8px 0">${tx('Sin datos','No data')}</div>`:`<div class="vcv" style="font-size:29px">${v.sys}<span style="font-size:14px;font-weight:500">/${v.dia}</span></div><div class="vcu">mmHg</div>${bdg(bp)}`}
      </div>`:''}
      ${vis.showGl?`<div class="vcard" style="padding:16px;border-left:3px solid ${noD?'var(--bdr)':gl.bg};position:relative" onclick="openLog()">
        <span class="tap-hint" style="position:absolute;top:12px;right:12px">›</span>
        <div class="vcl">🩸 ${tx('Glucosa','Glucose')}${noD?'':` · ${glCtxLabel(v.glCtx)}`}</div>
        ${noD?`<div style="font-size:13px;color:var(--text2);padding:8px 0">${tx('Sin datos','No data')}</div>`:`<div class="vcv" style="font-size:29px">${fmtGl(v.gl)}</div><div class="vcu">${glU()}</div>${bdg(gl)}`}
      </div>`:''}
    </div>

    <!-- FC: siempre visible, sin importar el diagnóstico -->
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:11px 16px;cursor:pointer" onclick="openLog()">
      <div style="display:flex;align-items:center;gap:9px">
        <span style="font-size:16px">❤️</span>

          <span style="display:flex;align-items:center;gap:3px"><svg width="12" height="3"><line x1="0" y1="1.5" x2="12" y2="1.5" stroke="#2E7D32" stroke-width="1.2" stroke-dasharray="3,2"/></svg>${tx('Meta','Goal')}</span>

    <div style="text-align:center;font-size:11px;color:var(--text3);padding-bottom:4px">⚕️ ${tx('Esta app no reemplaza la consulta médica.','This app does not replace medical consultation.')}</div>

}

function rLog(){
  const vis=vitalsVisibility();
  const bp=classifyBP(s.sys,s.dia);
  const gl=classifyGl(s.glucose,s.glucoseContext);
  const hr=classifyHR(s.hr);
  const abnorm=(vis.showBP&&bp.k!=='normal'&&bp.k!=='elev')||hr.k!=='normal'||(vis.showGl&&gl.k!=='ok');
  const glDisplay=fmtGl(s.glucose);
  const goalDisplay=fmtGl(glGoalFor(s.glucoseContext));
  const timeLabel=vis.showBP&&vis.showGl?tx('PA, FC y Glucosa<br>tomadas a las:','BP, HR & Glucose<br>taken at:')
    :vis.showBP?tx('PA y FC<br>tomadas a las:','BP & HR<br>taken at:')
    :vis.showGl?tx('FC y Glucosa<br>tomadas a las:','HR & Glucose<br>taken at:')
    :tx('FC<br>tomada a las:','HR<br>taken at:');
  return`
    <!-- HORA: escribe directamente con teclado (input nativo) o ajusta con los
         botones −/+ para cambios finos de un minuto. Reemplaza los antiguos
         botones AM/PM, que no movían la hora mostrada. -->
    <div class="card">
      <div class="slbl" style="margin-bottom:8px">${tx('Hora de la medición','Measurement time')}</div>
      <div style="font-size:12px;color:var(--text2);line-height:1.55;margin-bottom:10px">${timeLabel}</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <input type="time" class="inp-t" style="flex:1;min-width:130px;padding:10px 8px;font-size:18px" value="${fmtTime(s.readingMinutes)}" oninput="if(this.value)s.readingMinutes=parseT(this.value)" onchange="onTimeInp(this.value)">
        <div style="display:flex;align-items:center;gap:3px;flex-shrink:0">
          <button class="step-b" style="width:36px;height:38px" onclick="setState(st=>({readingMinutes:((st.readingMinutes-1+1440)%1440)}))">−</button>
          <div style="font-size:16px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;min-width:76px;text-align:center">${fmtTime12(s.readingMinutes)}</div>
          <button class="step-b" style="width:36px;height:38px" onclick="setState(st=>({readingMinutes:(st.readingMinutes+1)%1440}))">+</button>
        </div>
      </div>
    </div>
    <!-- PA (condicional a HTA) -->
    ${vis.showBP?`<div class="card">
      <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px">🫀 ${tx('Presión Arterial','Blood Pressure')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${[{lbl:tx('Sistólica','Systolic'),key:'sys',val:s.sys,min:50,max:260,u:'mmHg'},
           {lbl:tx('Diastólica','Diastolic'),key:'dia',val:s.dia,min:30,max:180,u:'mmHg'}]
          .map(f=>`<div>
            <div style="font-size:10px;font-weight:600;color:var(--text2);text-align:center;margin-bottom:5px">${f.lbl}</div>
            <div class="step">
              <button class="step-b" style="width:30px;height:44px;font-size:20px" onclick="setState(st=>({${f.key}:clamp(st.${f.key}-1,${f.min},${f.max})}))">−</button>
              <div><div class="step-v" style="font-size:18px">${f.val}</div><div class="step-u">${f.u}</div></div>
              <button class="step-b" style="width:30px;height:44px;font-size:20px" onclick="setState(st=>({${f.key}:clamp(st.${f.key}+1,${f.min},${f.max})}))">+</button>
            </div>
          </div>`).join('')}
      </div>
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">${bdg(bp)}<span style="font-size:10px;color:var(--text2);align-self:center">PA</span></div>
    </div>`:''}
    <!-- FC: siempre visible, sin importar el diagnóstico -->
    <div class="card">
      <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px">❤️ ${tx('Frecuencia Cardíaca','Heart Rate')}</div>
      <div style="max-width:140px;margin:0 auto">
        <div class="step">
          <button class="step-b" style="width:30px;height:44px;font-size:20px" onclick="setState(st=>({hr:clamp(st.hr-1,20,220)}))">−</button>
          <div><div class="step-v" style="font-size:18px">${s.hr}</div><div class="step-u">bpm</div></div>
          <button class="step-b" style="width:30px;height:44px;font-size:20px" onclick="setState(st=>({hr:clamp(st.hr+1,20,220)}))">+</button>
        </div>
      </div>
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center">${bdg(hr)}<span style="font-size:10px;color:var(--text2);align-self:center">FC</span></div>
    </div>
    <!-- GLUCOSA (condicional a Diabetes) -->
    ${vis.showGl?`<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:13px;font-weight:700;color:var(--text)">🩸 ${tx('Glucosa en sangre','Blood glucose')}</div>
        <div class="seg">
          <button class="seg-btn ${!isMmol()?'on':''}" onclick="setState({glucoseUnit:'mgdl'})">mg/dL</button>
          <button class="seg-btn ${isMmol()?'on':''}" onclick="setState({glucoseUnit:'mmol'})">mmol/L</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:10px">
        <div class="step">
          <button class="step-b" onclick="setState(st=>({glucose:clamp(isMmol()?Math.round(st.glucose-GFACTOR):st.glucose-1,20,500)}))">−</button>
          <div><div class="step-v">${glDisplay}</div><div class="step-u">${glU()}</div></div>
          <button class="step-b" onclick="setState(st=>({glucose:clamp(isMmol()?Math.round(st.glucose+GFACTOR):st.glucose+1,20,500)}))">+</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <button onclick="setState({glucoseContext:'ayunas'})" style="padding:9px 10px;border-radius:10px;border:1.5px solid ${s.glucoseContext==='ayunas'?'var(--teal)':'var(--bdr)'};background:${s.glucoseContext==='ayunas'?'rgba(0,191,165,.1)':'var(--surf2)'};cursor:pointer;font-size:11.5px;font-weight:700;color:${s.glucoseContext==='ayunas'?'var(--teal)':'var(--text2)'};font-family:Inter,sans-serif;white-space:nowrap">${tx('En ayunas','Fasting')}</button>
          <button onclick="setState({glucoseContext:'post'})" style="padding:9px 10px;border-radius:10px;border:1.5px solid ${s.glucoseContext==='post'?'var(--teal)':'var(--bdr)'};background:${s.glucoseContext==='post'?'rgba(0,191,165,.1)':'var(--surf2)'};cursor:pointer;font-size:11.5px;font-weight:700;color:${s.glucoseContext==='post'?'var(--teal)':'var(--text2)'};font-family:Inter,sans-serif;white-space:nowrap">${tx('Posprandial','Post-meal')}</button>
        </div>
      </div>
      ${glucGauge(s.glucose,s.glucoseContext)}
      <!-- Meta: solo lectura aquí, se edita en Perfil > Salud -->
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div style="font-size:11px;font-weight:600;color:${s.glucose<=glGoalFor(s.glucoseContext)?'var(--green)':'var(--amber)'}">${s.glucose<=glGoalFor(s.glucoseContext)?tx('✓ Dentro de tu meta','✓ Within your goal'):tx('▲ Por encima de meta','▲ Above goal')} · ${tx('meta','goal')} ${goalDisplay} ${glU()}</div>
        <button onclick="setState({screen:'profile',profileView:'salud'})" style="background:none;border:none;color:var(--indigo);font-size:12px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;flex-shrink:0">${tx('Editar meta ›','Edit goal ›')}</button>
      </div>
    </div>`:''}
    <!-- SÍNTOMAS (condicional) -->
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <span style="font-size:13px;font-weight:600;color:var(--text)">${tx('¿Sentiste algo raro hoy?','Did you feel anything unusual today?')}</span>
        <div class="seg">
          <button class="seg-btn ${!s.symToggle?'on':''}" onclick="setState({symToggle:false})">${tx('No','No')}</button>
          <button class="seg-btn ${s.symToggle?'on':''}" onclick="setState({symToggle:true})">${tx('Sí','Yes')}</button>
        </div>
      </div>
      ${s.symToggle?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
        ${[{k:'headache',ic:'🤕',l:tx('Dolor de cabeza','Headache')},{k:'dizzy',ic:'😵',l:tx('Mareo','Dizziness')},{k:'blur',ic:'👁️',l:tx('Visión borrosa','Blurred vision')},{k:'palp',ic:'💓',l:tx('Palpitaciones','Palpitations')},{k:'fatigue',ic:'😪',l:tx('Fatiga','Fatigue')},{k:'fever',ic:'🌡️',l:tx('Fiebre','Fever')}]
          .map(sym=>`<button onclick="toggleSym('${sym.k}')" style="display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:10px;border:1.5px solid ${s.symptoms[sym.k]?'var(--indigo)':'var(--bdr)'};background:${s.symptoms[sym.k]?'rgba(91,79,224,.08)':'var(--surf2)'};cursor:pointer;font-family:Inter,sans-serif">
            <span style="font-size:15px">${sym.ic}</span><span style="font-size:12px;font-weight:600;color:${s.symptoms[sym.k]?'var(--indigo)':'var(--text2)'}">${sym.l}</span>
          </button>`).join('')}
      </div>`:''}
    </div>
    <!-- NOTAS -->
    <div class="card">
      <div class="slbl" style="margin-bottom:8px">${tx('Notas (opcional)','Notes (optional)')}</div>
      <textarea class="inp" rows="2" placeholder="${tx('Después de ejercicio, estresado...','After exercise, stressed...')}" oninput="s.notes=this.value">${s.notes}</textarea>
    </div>
    ${abnorm&&!s.noData?`<div class="alert aw"><span>📲</span><div style="font-size:12px;color:#E65100">${tx('Al guardar se notificará a tus familiares conectados por valores fuera de rango.','Your connected family will be notified when saving out-of-range values.')}</div></div>`:''}
    <div style="text-align:center;font-size:11px;color:var(--text3)">⚕️ ${tx('Esta app no reemplaza la consulta médica.','This app does not replace medical consultation.')}</div>
    <div style="text-align:center;font-size:9.5px;color:var(--text3)">© 2026 HJaime Studios. ${tx('Todos los derechos reservados.','All rights reserved.')}</div>
    <button class="btn-p teal" onclick="saveLog()">📋 ${tx('Guardar Lectura','Save Reading')}</button>
    <button class="btn-s" onclick="cancelLog()">${tx('Cancelar','Cancel')}</button>`;
}

function rHistory(){
  const vis=vitalsVisibility();
  const noD=s.noData;
  const days=s.lang==='ES'?['L','M','X','J','V','S','D']:['M','T','W','T','F','S','S'];
  const ranges=[{id:'Semana',l:tx('7d','7d')},{id:'Mes',l:tx('30d','30d')},{id:'3M',l:'3M'},{id:'6M',l:'6M'}];
  const premLocked=(s.range==='3M'||s.range==='6M')&&!s.premium&&!s.trialActive;
  const sysA=s.crisis?[155,162,158,175,168,178,185]:[128,135,130,142,127,133,132];
  const diaA=s.crisis?[98,102,100,110,106,115,122]:[82,86,84,90,81,85,84];
  const hrA=s.crisis?DEMO_HR_CRISIS:DEMO_HR_NORMAL;
  const sysAvg=Math.round(sysA.reduce((a,v)=>a+v,0)/sysA.length);
  const diaAvg=Math.round(diaA.reduce((a,v)=>a+v,0)/diaA.length);
  const hrAvg=Math.round(hrA.reduce((a,v)=>a+v,0)/hrA.length);

  // Glucose: same shared demo dataset used elsewhere, now with a real per-reading
  // context (ayunas/posprandial) — today's slot reflects the live value+context.
  // A context toggle above the chart filters to only the matching readings/days,
  // so the average and the chart never mix fasting and post-meal numbers.
  const glFull=(s.crisis?DEMO_GL_CRISIS:DEMO_GL_NORMAL).map((d,i)=>
    i===6?{v:s.crisis?285:s.glucose,ctx:s.crisis?'ayunas':s.glucoseContext}:d);
  const glCtxSel=s.historyGlCtx||'ayunas';
  const glPairs=glFull.map((d,i)=>({...d,day:days[i]})).filter(p=>p.ctx===glCtxSel);
  const glA=glPairs.map(p=>p.v);
  const glDays=glPairs.map(p=>p.day);
  const glAvg=glA.length?Math.round(glA.reduce((a,v)=>a+v,0)/glA.length):null;

  const abnormals=noD?[]:[{d:tx('Hoy 07:32','Today 07:32'),sys:s.crisis?185:142,dia:s.crisis?122:90,gl:s.crisis?285:165,glCtx:'ayunas'},{d:tx('Ayer 20:15','Yest. 20:15'),sys:s.crisis?178:130,dia:s.crisis?115:84,gl:s.crisis?260:172,glCtx:'post'}].filter(r=>(vis.showBP&&classifyBP(r.sys,r.dia).k!=='normal')||(vis.showGl&&classifyGl(r.gl,r.glCtx).k!=='ok'));

  return`
    <!-- Range selector -->
    <div style="display:flex;gap:7px">

    </div>

function rMedications(){
  const meds=computeMeds();
  const takenC=meds.reduce((a,m)=>a+m.slots.filter(sl=>sl.check).length,0);
  const totalC=meds.reduce((a,m)=>a+m.slots.length,0);
  const pct=totalC?Math.round(takenC/totalC*100):100;
  return`
    <!-- Summary -->
    <div class="card" style="display:flex;align-items:center;justify-content:space-between">
      <div><div style="font-size:20px;font-weight:800;color:var(--text)">${takenC}/${totalC}</div><div style="font-size:12px;color:var(--text2)">${tx('dosis tomadas hoy','doses taken today')}</div></div>
      <div style="text-align:right"><div class="ab" style="width:80px;margin-bottom:4px"><div class="af ${pct<100?'warn':''}" style="width:${pct}%"></div></div><div style="font-size:12px;font-weight:700;color:${pct===100?'var(--green)':'var(--amber)'};">${pct===100?tx('Completo ✓','Complete ✓'):tx('Pendiente','Pending')}</div></div>
    </div>
    <!-- Meds -->
    ${!meds.length?`<div class="card" style="text-align:center;padding:28px"><div style="font-size:36px;margin-bottom:10px">💊</div><div style="font-weight:700;font-size:15px;color:var(--text);margin-bottom:6px">${tx('Sin medicamentos','No medications')}</div><div style="font-size:13px;color:var(--text2)">${tx('Agrega tus medicamentos para recibir recordatorios.','Add medications to receive reminders.')}</div></div>`
    :meds.map(m=>`<div class="card" style="position:relative">
      <div style="display:flex;align-items:center;gap:11px;margin-bottom:12px">
        <div style="width:40px;height:40px;border-radius:12px;background:rgba(0,121,107,.1);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0">💊</div>
        <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700;color:var(--text)">${m.name}</div><div style="font-size:12px;color:var(--text2)">${m.dose} · ${m.timesPerDay}x/${tx('día','day')}</div></div>
        <button onclick="toggleMenu('${m.id}')" style="width:32px;height:32px;border-radius:50%;border:1px solid var(--bdr);background:var(--surf2);cursor:pointer;font-size:16px;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0">⋯</button>
        ${s.openMedMenuId===m.id?`<div class="med-menu"><button class="mmi" onclick="startEditMed('${m.id}')">✏️ ${tx('Editar','Edit')}</button><button class="mmi del" onclick="startDeleteMed('${m.id}')">🗑️ ${tx('Eliminar','Delete')}</button></div>`:''}
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${m.slots.map((sl,i)=>`<button onclick="toggleMed('${m.id}',${i})" style="display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;border:1.5px solid ${sl.check?'var(--teal)':'var(--bdr)'};background:${sl.check?'rgba(0,191,165,.08)':'var(--surf2)'};cursor:pointer;font-family:Inter,sans-serif">
          <span style="width:18px;height:18px;border-radius:50%;border:2px solid ${sl.check?'var(--teal)':'var(--text2)'};background:${sl.check?'var(--teal)':'transparent'};display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0">${sl.check?'✓':''}</span>

        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:4px"><span>${tx('Adherencia 7 días','7-day adherence')}</span><span><b>${m.anyMissed?'75':'100'}%</b></span></div>

  const alerts=s.noData?[]:[

    {time:tx('Ayer 20:15','Yesterday 20:15'),msg:`${tx('Glucosa','Glucose')} (${glCtxLabel(v.glCtx)}) ${fmtGl(v.gl)} ${glU()} — ${glA.lbl}`,sev:alertSevGl(glA.k),icon:'🩸'},

  return`<div style="background:var(--surf);padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:12px;flex-shrink:0">

// ─── Event handlers ──────────────────────────────────────────────────────────
function onTimeInp(v){if(!v)return;const[h,m]=v.split(':').map(Number);setState({readingMinutes:h*60+m});}
function parseT(v){if(!v)return 0;const[h,m]=v.split(':').map(Number);return h*60+m;}
function toggleMed(id,i){setState(st=>{const t={...st.medTaken};const arr=[...(t[id]||Array(st.customMeds.find(m=>m.id===id).timesPerDay).fill(false))];arr[i]=!arr[i];t[id]=arr;return{medTaken:t};});}
function toggleMenu(id){setState(st=>({openMedMenuId:st.openMedMenuId===id?null:id}));}
function toggleSym(key){setState(st=>{const sym={...st.symptoms};if(key==='none'){Object.keys(sym).forEach(k=>sym[k]=false);sym.none=!st.symptoms.none;}else{sym[key]=!sym[key];sym.none=false;}return{symptoms:sym};});}

// Registrar (Log) works as a draft: values already change live as you tap the
// steppers (so the reading always reflects what's on screen), but the draft is
// only COMMITTED when you press "Guardar Lectura". "Cancelar" restores whatever
// was there before you opened Registrar, discarding anything typed in between.
const LOG_FIELDS=['sys','dia','hr','glucose','notes','symptoms','symToggle','readingMinutes','glucoseContext'];
function openLog(){
  setState(st=>{
    const backup={};
    LOG_FIELDS.forEach(k=>backup[k]=(k==='symptoms')?{...st.symptoms}:st[k]);
    return{screen:'log',logBackup:backup};
  });
}
function cancelLog(){
  setState(st=>({...(st.logBackup||{}),screen:'dashboard',logBackup:null}));
}
function saveLog(){
  setState({screen:'dashboard',logBackup:null});
}
function startEditMed(id){const m=s.customMeds.find(c=>c.id===id);if(!m)return;setState({showAddMed:true,editingMedId:id,newMedName:m.name,newMedDose:m.dose,newMedTimesPerDay:m.timesPerDay,openMedMenuId:null});}
function startDeleteMed(id){setState({deleteMedId:id,openMedMenuId:null});}
function openAddMed(){setState({showAddMed:true,editingMedId:null,newMedName:'',newMedDose:'',newMedTimesPerDay:2});}
function closeAddMed(){setState({showAddMed:false,editingMedId:null,newMedName:'',newMedDose:'',newMedTimesPerDay:2});}

// Same average figures the Reportes stat grid already showed — now also the
// single source of truth for the report-view screen and the shared text message.
// `med` is that period's overall medication-adherence % — a fixed archived figure,
// deliberately NOT derived from today's live medTaken checkboxes: a saved report
// is a snapshot of a past period, so its adherence must stay the same no matter
// what you check off today, and must not retroactively change every open report.
const REPORT_STATS={weekly:{sys:128,dia:82,hr:74,glAyunas:108,glPost:158,med:92},monthly:{sys:133,dia:85,hr:76,glAyunas:128,glPost:172,med:88},sixmonth:{sys:136,dia:87,hr:77,glAyunas:142,glPost:185,med:83}};
function reportCatalog(){
  return[
    {period:'weekly',l:tx('Resumen semanal','Weekly summary'),d:tx('18–24 Ago 2026','Aug 18–24, 2026')},
    {period:'weekly',l:tx('Resumen semanal','Weekly summary'),d:tx('11–17 Ago 2026','Aug 11–17, 2026')},
    {period:'weekly',l:tx('Resumen semanal','Weekly summary'),d:tx('4–10 Ago 2026','Aug 4–10, 2026')},
    s.monthlyReport?{...s.monthlyReport,period:'monthly'}:{period:'monthly',l:tx('Resumen mensual','Monthly summary'),d:tx('Julio 2026','July 2026')},
    s.sixMonthReport?{...s.sixMonthReport,period:'sixmonth'}:{period:'sixmonth',l:tx('Resumen de 6 meses','6-month summary'),d:tx('Mar–Ago 2026','Mar–Aug 2026')},
  ];
}
// Plain-text summary — deliberately simple (no image/PDF) so WhatsApp and Email
// can send it via a plain link, with no extra library or backend involved.
function reportMessage(period){
  const vis=vitalsVisibility();
  const ds=REPORT_STATS[period];
  const plbl={weekly:tx('Resumen Semanal','Weekly Summary'),monthly:tx('Resumen Mensual','Monthly Summary'),sixmonth:tx('Resumen de 6 Meses','6-Month Summary')}[period];
  const drange={weekly:tx('18–24 Ago 2026','Aug 18–24, 2026'),monthly:tx('Agosto 2026','August 2026'),sixmonth:tx('Mar–Ago 2026','Mar–Aug 2026')}[period];
  const bpk=classifyBP(ds.sys,ds.dia).k,glkA=classifyGl(ds.glAyunas,'ayunas').k,glkP=classifyGl(ds.glPost,'post').k;
  const outOfRange=(vis.showBP&&bpk!=='normal'&&bpk!=='elev')||(vis.showGl&&(glkA!=='ok'||glkP!=='ok'));
  const lines=[
    `📋 ${plbl} — VitalPulse Sync`,
    `${s.name} · ${drange}`,
    '',
    ...(vis.showBP?[`🫀 ${tx('Presión','BP')}: ${ds.sys}/${ds.dia} mmHg ${tx('promedio','avg')}`]:[]),
    `❤️ FC: ${ds.hr} bpm ${tx('promedio','avg')}`,
    ...(vis.showGl?[
      `🩸 ${tx('Glucosa en ayunas','Fasting glucose')}: ${fmtGl(ds.glAyunas)} ${glU()} ${tx('promedio','avg')}`,
      `🩸 ${tx('Glucosa posprandial','Post-meal glucose')}: ${fmtGl(ds.glPost)} ${glU()} ${tx('promedio','avg')}`,
    ]:[]),
    `💊 ${tx('Adherencia a medicamentos','Medication adherence')}: ${ds.med}% ${tx('promedio del período','period average')}`,
  ];
  if(outOfRange)lines.push('',tx('⚠️ Cifras promedio fuera de rango — revisar con el médico.','⚠️ Average readings out of range — please review with the doctor.'));
  lines.push('',tx('Generado por VitalPulse Sync','Generated by VitalPulse Sync'));
  return lines.join('\n');
}
// wa.me and mailto are plain links — no library, no backend, works on any phone.
function shareLink(channel,period){
  const msg=reportMessage(period);
  if(channel==='whatsapp')return'https://wa.me/?text='+encodeURIComponent(msg);
  return'mailto:?subject='+encodeURIComponent(tx('Reporte VitalPulse Sync','VitalPulse Sync Report'))+'&body='+encodeURIComponent(msg);
}
function genReport(){
  const p=s.reportPeriod||'weekly';
  if(p!=='weekly'&&!s.premium&&!s.trialActive){setState({showPaywall:true});return;}
  // 6-month reports auto-send to family only — there's no WhatsApp/Email picker
  // for that period (see rReports), so a shareChannel left over from a weekly/
  // monthly report must never trigger a share-link popup here.
  if(s.shareChannel&&p!=='sixmonth')window.open(shareLink(s.shareChannel,p),'_blank');
  setState(st=>{const u={reportGenerated:true};if(p==='monthly')u.monthlyReport={l:tx('Resumen mensual','Monthly summary'),d:tx('Agosto 2026','August 2026')};if(p==='sixmonth')u.sixMonthReport={l:tx('Resumen de 6 meses','6-month summary'),d:tx('Mar–Ago 2026','Mar–Aug 2026')};return u;});
}

// Historical 7-day series for a saved report — shifts the same weekly demo shape
// (already used elsewhere) so its average matches that period's REPORT_STATS figure.
// A saved report is historical, so it is intentionally independent of the live
// s.crisis demo toggle.
// Glucose needs its ayunas-tagged and posprandial-tagged points shifted
// INDEPENDENTLY so each sub-series' average matches its own REPORT_STATS target —
// the non-consecutive ayunas/post positions from DEMO_GL_NORMAL are preserved.
function reportSeries(period){
  const t=REPORT_STATS[period]||REPORT_STATS.weekly;
  const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const shift=(a,target)=>a.map(v=>Math.round(v+(target-avg(a))));
  const sysBase=DEMO_BP_NORMAL.map(d=>d.sys),diaBase=DEMO_BP_NORMAL.map(d=>d.dia);
  const ayunasVals=DEMO_GL_NORMAL.filter(d=>d.ctx==='ayunas').map(d=>d.v);
  const postVals=DEMO_GL_NORMAL.filter(d=>d.ctx==='post').map(d=>d.v);
  const ayunasShifted=shift(ayunasVals,t.glAyunas),postShifted=shift(postVals,t.glPost);
  let ai=0,pi=0;
  const glA=DEMO_GL_NORMAL.map(d=>d.ctx==='post'?{v:postShifted[pi++],ctx:'post'}:{v:ayunasShifted[ai++],ctx:'ayunas'});
  return{sysA:shift(sysBase,t.sys),diaA:shift(diaBase,t.dia),hrA:shift(DEMO_HR_NORMAL,t.hr),glA};
}

// ─── Main render ─────────────────────────────────────────────────────────────
function render(){
  const fullScreens=['onboarding','login','caregiverCode','caregiverFeed'];
  const isFull=fullScreens.includes(s.screen);
  const sel=document.getElementById('scr-sel');
  if(sel&&!isFull)sel.value=s.screen;

  // Same screen (and, for Perfil, same sub-view) as last render → restore where the
  // user was scrolled to instead of snapping back to the top.
  const scrKey=s.screen+'|'+(s.profileView||'');
  const prevScr=root.querySelector('.scr');
  if(prevScr)__scrollTop=prevScr.scrollTop;
  const restoreScroll=scrKey===__scrKey;
  __scrKey=scrKey;

  if(isFull){
    let fc='';
    if(s.screen==='onboarding')fc=rOnboarding();
    else if(s.screen==='login')fc=rLogin();
    else if(s.screen==='caregiverCode')fc=rCaregiverCode();
    else if(s.screen==='caregiverFeed'){root.innerHTML=rCaregiverFeed();return;}
    root.innerHTML=`<div class="scr" style="display:flex;flex-direction:column">${fc}</div>`;
    return;
  }

  let bodyHtml='';
  if(s.screen==='dashboard')bodyHtml=rDashboard();
  else if(s.screen==='log')bodyHtml=rLog();
  else if(s.screen==='history')bodyHtml=rHistory();
  else if(s.screen==='medications')bodyHtml=rMedications();
  else if(s.screen==='reports')bodyHtml=rReports();
  else if(s.screen==='reportView')bodyHtml=rReportView();
  else if(s.screen==='profile')bodyHtml=rProfile();

  root.innerHTML=`
    ${rHeader()}
    <div class="scr"><div class="pad">${bodyHtml}</div></div>
    ${rTabs()}
    ${s.showPaywall?rPaywall():''}
    ${s.showAddMed?rAddMed():''}
    ${s.deleteMedId?rDeleteMed():''}
    ${s.openMedMenuId?`<div onclick="setState({openMedMenuId:null})" style="position:absolute;inset:0;z-index:100"></div>`:''}
  `;
  if(restoreScroll){
    const newScr=root.querySelector('.scr');
    if(newScr)newScr.scrollTop=__scrollTop;
  }
}

// Por defecto la app abre en modo claro, sin importar la preferencia del sistema
// operativo/navegador — antes, si el dispositivo tenía activado el modo oscuro,
// la página heredaba modo oscuro automáticamente (vía prefers-color-scheme) sin
// que nadie lo hubiera elegido dentro de la app. Ahora se fija modo claro al
// cargar; el paciente puede cambiar a oscuro con el botón 🌙 cuando quiera.
setTheme('light');
render();

<script>
// Altura real de la pantalla, calculada con JS — algunas versiones de Safari
// en iOS no miden bien "100dvh" justo al cargar la página o al mostrar/ocultar
// su propia barra de herramientas, dejando un espacio en blanco abajo. Esto
// lo corrige guardando el alto real en una variable CSS (--vh) que se
// actualiza cada vez que cambia el tamaño visible.
function setRealVH(){
  document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
}
setRealVH();
window.addEventListener('resize', setRealVH);
window.addEventListener('orientationchange', setRealVH);
// Un segundo cálculo poco después de cargar, por si Safari todavía estaba
// ajustando su barra de herramientas en el primer momento.
setTimeout(setRealVH, 300);
</script>
